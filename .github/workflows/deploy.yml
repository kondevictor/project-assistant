name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-assistant-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: project-assistant-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start PostgreSQL
        uses: harmonious/postgresql-action@v1
        with:
          postgresql db: project_assistant
          postgresql user: postgres
          postgresql password: postgres
          postgresql version: "16"

      - name: Run migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/project_assistant

      - name: Seed database
        run: npm run db:seed
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/project_assistant

      - name: Build static export
        run: npm run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/project_assistant

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: project-assistant-app/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4